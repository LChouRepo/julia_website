[build]
  command = "npm run build"
  publish = "dist"

# old addresses from the previous site
[[redirects]]
  from = "/releases/*"
  to = "/media/"
  status = 301
[[redirects]]
  from = "/events/*"
  to = "/concerts/"
  status = 301
[[redirects]]
  from = "/contact/thanks"
  to = "/thanks/"
  status = 301
